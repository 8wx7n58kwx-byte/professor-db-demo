<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Professor DB Demo</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#25324a;font:15px/1.8 Tahoma,Arial,sans-serif}header,footer{background:white;padding:20px;border-bottom:1px solid #e5e7eb}.wrap{max-width:1120px;margin:auto}header .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}a{color:#bf501c;text-decoration:none}nav{display:flex;gap:18px;flex-wrap:wrap}.notice{background:#fff1cf;padding:9px 20px;font-size:12px}main{min-height:70vh;padding:32px 18px}h1{font-size:32px;line-height:1.4}h2{font-size:22px}h3{font-size:17px}.hero{padding:40px;background:linear-gradient(120deg,#ffe7d4,white);border-radius:20px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:white;border:1px solid #e3e7ee;border-radius:14px;padding:22px;margin-bottom:16px;overflow-wrap:anywhere}.card h3{margin:0 0 8px}.muted{color:#697386;font-size:13px}.tag{display:inline-block;background:#eef1f6;border-radius:6px;padding:3px 8px;margin:2px;font-size:12px}button,.btn{background:#e76625;color:white;border:0;border-radius:8px;padding:10px 17px;font:inherit;cursor:pointer;display:inline-block}input,select{padding:12px;border:1px solid #dce1e8;border-radius:8px;font:inherit;max-width:100%}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.toolbar input{flex:1;min-width:180px}.toolbar select{max-width:240px}.auth{max-width:460px;margin:20px auto}.auth label{display:block;margin:14px 0}.auth input{width:100%;margin-top:5px}.error{color:#a42525}.stats{display:flex;gap:16px;margin:22px 0}.stats .card{flex:1;text-align:center}.stats strong{display:block;color:#e76625;font-size:29px}.pages{display:flex;gap:8px;justify-content:center;margin:20px}.pages button[aria-current]{background:#913b13}:focus-visible{outline:3px solid #ffb47e;outline-offset:3px}@media(max-width:780px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.hero{padding:24px}nav{gap:12px;font-size:13px}.stats{gap:6px}.stats .card{padding:12px 5px;font-size:11px}.toolbar select{max-width:100%;width:100%}}</style></head><body><header><div class="wrap"><a href="#home"><strong>Professor DB</strong><br><small>ระบบฐานข้อมูลอาจารย์ — Demo</small></a><nav><a href="#home">หน้าแรก</a><a href="#professors">ค้นหาอาจารย์</a><a href="#research">ค้นหางานวิจัย</a><a id="account" href="#login">เข้าสู่ระบบ</a></nav></div></header><div class="notice">เว็บไซต์ต้นแบบอิสระ ไม่ใช่เว็บทางการของ สจล. ข้อมูลทั้งหมดเป็นข้อมูลจำลอง ห้ามใช้รหัสผ่านจริง</div><main class="wrap" id="app"></main><footer><div class="wrap">Professor DB — Single-file demo · ไม่มีการเชื่อมฐานข้อมูลหรือบัญชีมหาวิทยาลัย</div></footer><script>
'use strict';
const people=[{id:1,name:'ดร. กิตติ ตัวอย่าง',dept:'คอมพิวเตอร์',skills:'ปัญญาประดิษฐ์ การพัฒนาเว็บไซต์ การศึกษา',position:'ผู้ช่วยศาสตราจารย์'},{id:2,name:'ดร. วิภา สาธิต',dept:'ไฟฟ้า',skills:'พลังงานทดแทน สมาร์ตกริด',position:'รองศาสตราจารย์'},{id:3,name:'ดร. ธนา ตัวอย่าง',dept:'เครื่องกล',skills:'ไฮโดรเจน อุณหพลศาสตร์',position:'ผู้ช่วยศาสตราจารย์'},{id:4,name:'ดร. มาลี สาธิต',dept:'เคมี',skills:'วัสดุศาสตร์ สิ่งแวดล้อม',position:'อาจารย์'},{id:5,name:'ดร. ปกรณ์ ตัวอย่าง',dept:'หุ่นยนต์',skills:'หุ่นยนต์ Computer Vision',position:'รองศาสตราจารย์'},{id:6,name:'ดร. อรุณี สาธิต',dept:'ชีวการแพทย์',skills:'สัญญาณชีวภาพ อุปกรณ์การแพทย์',position:'ผู้ช่วยศาสตราจารย์'},{id:7,name:'ดร. นที ตัวอย่าง',dept:'โยธา',skills:'โครงสร้าง วัสดุก่อสร้าง',position:'อาจารย์'},{id:8,name:'ดร. พิมพ์ สาธิต',dept:'อุตสาหการ',skills:'โลจิสติกส์ การจัดการการผลิต',position:'ผู้ช่วยศาสตราจารย์'}];
const titles=['ระบบแนะนำบทเรียนด้วยปัญญาประดิษฐ์','การจัดการพลังงานในระบบไมโครกริด','ระบบผลิตไฮโดรเจนจากพลังงานหมุนเวียน','วัสดุดูดซับสำหรับบำบัดน้ำ','การตรวจสอบชิ้นงานด้วยภาพ','อุปกรณ์ตรวจวัดสัญญาณชีวภาพ','การวิเคราะห์โครงสร้างจำลอง','การปรับปรุงเส้นทางขนส่ง'];
const papers=people.map((p,i)=>({id:i+1,author:p.id,title:titles[i],year:2025-i%3,type:i%2?'บทความประชุมวิชาการ':'บทความวารสาร',abstract:'งานวิจัยจำลองนี้ใช้แสดงตัวอย่างข้อมูลในระบบเท่านั้น ไม่มีผลการทดลองหรือเอกสารตีพิมพ์จริง โดยยกตัวอย่างหัวข้อเกี่ยวกับ '+p.skills}));
const app=document.querySelector('#app');let user=false;let query='',dept='',year='',type='',page=1;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=s=>s.toLocaleLowerCase('th').trim();const person=id=>people.find(p=>p.id===Number(id));
function saved(){try{const a=JSON.parse(localStorage.getItem('professor-demo-saved')||'[]');return Array.isArray(a)?a.filter(Number.isInteger):[]}catch{return []}}
function pcard(p){return `<article class="card"><h3>${esc(p.name)}</h3><p class="muted">${esc(p.position)}</p><span class="tag">${esc(p.dept)}</span><p class="muted">${esc(p.skills)}</p><a class="btn" href="#professor/${p.id}">ดูข้อมูลอาจารย์</a></article>`}
function rcard(r){return `<article class="card"><span class="tag">${r.year}</span><span class="tag">${r.type}</span><h3>${esc(r.title)}</h3><p class="muted">${esc(person(r.author).name)}</p><a class="btn" href="#paper/${r.id}">อ่านรายละเอียด</a></article>`}
function home(){app.innerHTML=`<section class="hero"><p>PROFESSOR DIRECTORY</p><h1>เชื่อมต่อความรู้<br>ค้นพบความเชี่ยวชาญ</h1><p>ค้นหาอาจารย์และผลงานวิจัยตามสาขาที่คุณสนใจ</p><a class="btn" href="#professors">ค้นหาอาจารย์</a> <a href="#research">สำรวจงานวิจัย →</a></section><div class="stats"><div class="card"><strong>${people.length}</strong>อาจารย์จำลอง</div><div class="card"><strong>${people.length}</strong>ภาควิชาตัวอย่าง</div><div class="card"><strong>${papers.length}</strong>งานวิจัยจำลอง</div></div><h2>อาจารย์แนะนำ</h2><div class="grid">${people.slice(0,3).map(pcard).join('')}</div><h2>งานวิจัยตัวอย่าง</h2><div class="grid">${papers.slice(0,3).map(rcard).join('')}</div>`}
function search(kind){const isP=kind==='professors';app.innerHTML=`<h1>${isP?'ค้นหาอาจารย์':'ค้นหางานวิจัย'}</h1><p class="muted">ค้นหาชื่อ ภาควิชา หรือความเชี่ยวชาญ — ข้อมูลจำลองทั้งหมด</p><div class="toolbar"><input id="q" type="search" aria-label="คำค้นหา" placeholder="พิมพ์คำค้นหา..." value="${esc(query)}">${isP?`<select id="dept" aria-label="ภาควิชา"><option value="">ทุกภาควิชา</option>${people.map(p=>`<option ${dept===p.dept?'selected':''}>${p.dept}</option>`).join('')}</select>`:`<select id="year" aria-label="ปี"><option value="">ทุกปี</option>${[2025,2024,2023].map(y=>`<option ${String(y)===year?'selected':''}>${y}</option>`).join('')}</select><select id="type" aria-label="ประเภท"><option value="">ทุกประเภท</option>${['บทความวารสาร','บทความประชุมวิชาการ'].map(t=>`<option ${t===type?'selected':''}>${t}</option>`).join('')}</select>`}<button id="reset">ล้างตัวกรอง</button></div><p id="count" role="status"></p><div id="results" class="grid"></div><div id="pages" class="pages"></div>`;document.querySelector('#q').oninput=e=>{query=e.target.value;page=1;results(isP)};if(isP)document.querySelector('#dept').onchange=e=>{dept=e.target.value;page=1;results(isP)};else{document.querySelector('#year').onchange=e=>{year=e.target.value;page=1;results(isP)};document.querySelector('#type').onchange=e=>{type=e.target.value;page=1;results(isP)}}document.querySelector('#reset').onclick=()=>{query=dept=year=type='';page=1;search(kind)};results(isP)}
function results(isP){const list=isP?people.filter(p=>(!dept||p.dept===dept)&&norm(p.name+' '+p.dept+' '+p.skills).includes(norm(query))):papers.filter(r=>(!year||String(r.year)===year)&&(!type||r.type===type)&&norm(r.title+' '+person(r.author).name+' '+person(r.author).skills).includes(norm(query)));document.querySelector('#count').textContent=`พบ ${list.length} รายการ`;document.querySelector('#results').innerHTML=list.slice((page-1)*6,page*6).map(isP?pcard:rcard).join('')||'<p>ไม่พบข้อมูลที่ตรงกับการค้นหา</p>';document.querySelector('#pages').innerHTML=Array.from({length:Math.ceil(list.length/6)},(_,i)=>`<button data-page="${i+1}" ${page===i+1?'aria-current="page"':''}>${i+1}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=Number(b.dataset.page);results(isP)})}
function profile(id){const p=person(id);if(!p)return missing();app.innerHTML=`<a href="#professors">← กลับหน้าค้นหา</a><article class="card"><h1>${esc(p.name)}</h1><p>${p.position}</p><span class="tag">${p.dept}</span><h2>ความเชี่ยวชาญ</h2><p>${esc(p.skills)}</p><p>อีเมลตัวอย่าง: professor${p.id}@example.com</p><p class="muted">บุคคลจำลองสำหรับสาธิตระบบเท่านั้น</p><h2>ผลงานวิจัย</h2>${papers.filter(r=>r.author===p.id).map(rcard).join('')}</article>`}
function paper(id){const r=papers.find(r=>r.id===Number(id));if(!r)return missing();app.innerHTML=`<a href="#research">← กลับหน้างานวิจัย</a><article class="card"><span class="tag">${r.year}</span><span class="tag">${r.type}</span><h1>${esc(r.title)}</h1><a href="#professor/${r.author}">${esc(person(r.author).name)}</a><h2>บทคัดย่อ</h2><p>${esc(r.abstract)}</p><button id="save">${saved().includes(r.id)?'ยกเลิกการบันทึก':'บันทึกงานวิจัยในเบราว์เซอร์'}</button><p id="saveStatus" role="status"></p></article>`;document.querySelector('#save').onclick=()=>{let ids=saved();ids=ids.includes(r.id)?ids.filter(x=>x!==r.id):[...ids,r.id];try{localStorage.setItem('professor-demo-saved',JSON.stringify(ids));paper(id)}catch{document.querySelector('#saveStatus').textContent='เบราว์เซอร์ไม่อนุญาตให้บันทึก'}}}
function login(){if(user){location.hash='dashboard';return}app.innerHTML=`<section class="card auth"><h1>เข้าสู่ระบบสาธิต</h1><p class="muted">บัญชีทดสอบ: demo@example.com<br>รหัสผ่าน: demo1234<br>ห้ามใช้รหัสผ่านจริง ไม่มีการส่งข้อมูลไปยังเซิร์ฟเวอร์</p><form id="loginForm"><label>อีเมลทดสอบ<input id="email" type="email" autocomplete="off" placeholder="demo@example.com" required></label><label>รหัสผ่านทดสอบ<input id="password" type="password" autocomplete="off" placeholder="demo1234" required></label><p id="error" class="error" role="alert"></p><button>เข้าสู่ระบบสาธิต</button></form><p class="muted">ระบบนี้เป็น UI จำลอง ไม่ใช่ระบบยืนยันตัวตนจริง และจะออกจากระบบเมื่อรีเฟรชหน้า</p></section>`;document.querySelector('#loginForm').onsubmit=e=>{e.preventDefault();const pw=document.querySelector('#password');const ok=document.querySelector('#email').value.trim()==='demo@example.com'&&pw.value==='demo1234';pw.value='';if(ok){user=true;location.hash='dashboard'}else document.querySelector('#error').textContent='กรุณาใช้บัญชีทดสอบที่ระบุเท่านั้น'}}
function dashboard(){if(!user){location.hash='login';return}const list=papers.filter(r=>saved().includes(r.id));app.innerHTML=`<section class="card"><h1>พื้นที่สมาชิกสาธิต</h1><p>ผู้ใช้งานตัวอย่าง · demo@example.com</p><button id="logout">ออกจากระบบ</button><p class="muted">ไม่มีระบบสิทธิ์หรือข้อมูลสมาชิกจริง</p></section><h2>งานวิจัยที่บันทึก (${list.length})</h2><div class="grid">${list.map(rcard).join('')||'<p>ยังไม่มีรายการที่บันทึก</p>'}</div>`;document.querySelector('#logout').onclick=()=>{user=false;location.hash='home'}}
function missing(){app.innerHTML='<h1>ไม่พบข้อมูล</h1><a href="#home">กลับหน้าแรก</a>'}
function route(){const [key,id]=(location.hash.slice(1)||'home').split('/');const routes={home,professors:()=>search('professors'),research:()=>search('research'),professor:()=>profile(id),paper:()=>paper(id),login,dashboard};(routes[key]||missing)();const a=document.querySelector('#account');a.textContent=user?'พื้นที่สมาชิก':'เข้าสู่ระบบ';a.href=user?'#dashboard':'#login';window.scrollTo(0,0)}window.addEventListener('hashchange',()=>{query=dept=year=type='';page=1;route()});route();
</script></body></html>
